name: Trace Drive World local key

on:
  push:
    paths:
      - 'Tools/trace_script_lua.lua'
      - '.github/workflows/trace-drive-world-key.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Luau CLI
        run: |
          git clone --depth 1 https://github.com/luau-lang/luau.git /tmp/luau
          cmake -S /tmp/luau -B /tmp/luau/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/luau/build --target Luau.Repl.CLI -j4
      - name: Fetch original loader
        run: |
          curl -fsSL 'https://raw.githubusercontent.com/yumyum272/driving/refs/heads/main/script.lua' -o script.lua
          wc -c script.lua
          sha1sum script.lua
      - name: Build injected trace runner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          harness=Path('Tools/trace_script_lua.lua').read_text()
          src=Path('script.lua').read_text()
          marker='\n__TARGET_EXEC__\n'
          assert marker in harness
          eq='===='
          assert ']' + eq + ']' not in src
          lines = [
              "local __baseSetmetatable = setmetatable",
              "local __instrumentedIndex = {}",
              "setmetatable = function(t, mt)",
              "    if type(mt) == 'table' then",
              "        local idx = rawget(mt, '__index')",
              "        if type(idx) == 'table' and not __instrumentedIndex[idx] and next(idx) == nil then",
              "            __instrumentedIndex[idx] = true",
              "            local backing = {}",
              "            __baseSetmetatable(idx, {",
              "                __index = backing,",
              "                __newindex = function(_, k, v)",
              "                    backing[k] = v",
              "                    if type(v) == 'string' and v ~= '' then",
              "                        out('[DECRYPTED-CACHE]', simple(k), simple(v))",
              "                    end",
              "                end,",
              "            })",
              "        end",
              "    end",
              "    return __baseSetmetatable(t, mt)",
              "end",
          ]
          instrumentation='\n'.join(lines)+'\n'
          injected=("\n"+instrumentation+
                    "local __src = ["+eq+"["+src+"]"+eq+"]\n"
                    "local __chunk, __compileErr = loadstring(__src, '@script.lua')\n"
                    "if __chunk then ok, err = pcall(__chunk) else ok=false; err=__compileErr end\n")
          Path('trace_runner.luau').write_text(harness.replace(marker,injected,1))
          PY
      - name: Trace gate callbacks
        run: |
          /tmp/luau/build/luau trace_runner.luau | tee trace_key.log
      - uses: actions/upload-artifact@v4
        with:
          name: drive-world-key-trace
          path: trace_key.log
