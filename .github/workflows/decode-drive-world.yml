name: Decode Drive World loader

on:
  push:
    paths:
      - 'Tools/decode_script_lua.py'
      - 'Tools/probe_second_layer.py'
      - '.github/workflows/decode-drive-world.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode first layer
        run: |
          python Tools/decode_script_lua.py
      - name: Probe second layer
        run: |
          python Tools/probe_second_layer.py | tee second_layer_probe.log
      - uses: actions/upload-artifact@v4
        with:
          name: drive-world-static-analysis
          path: |
            script_lua_decoded_strings.txt
            second_layer_probe.log
